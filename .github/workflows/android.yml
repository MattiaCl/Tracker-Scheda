# Crea l'app Android (APK) e la pubblica nella pagina "Releases" del repository.
# Parte da sola quando cambiano i file nella cartella android/, oppure a mano da Actions → "App Android" → Run workflow.
name: App Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/scheda.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/scheda.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_B64 mancante: APK firmato con chiave temporanea (gli aggiornamenti non si installeranno sopra)"
          fi

      - name: Compila APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: scheda-palestra
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepara file
        run: cp android/app/build/outputs/apk/release/app-release.apk Scheda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scheda-apk
          path: Scheda.apk

      - name: Pubblica in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android --cleanup-tag --yes || true
          gh release create app-android Scheda.apk \
            --target "$GITHUB_SHA" \
            --title "App Android (build ${{ github.run_number }})" \
            --notes "Apri questa pagina dal telefono e tocca Scheda.apk per scaricarla e installarla."
